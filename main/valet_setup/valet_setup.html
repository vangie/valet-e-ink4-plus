<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Valet 随行 · 连接助理</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f4f2ed;color:#25231f;font:15px/1.7 system-ui,sans-serif}main{max-width:650px;margin:auto;padding:24px 18px}h1{font-size:25px;margin:0}h2{font-size:18px;margin:0 0 12px}p{margin:8px 0;color:#666158}section{margin:20px 0;background:white;padding:22px;border:1px solid #e2ded4;border-radius:16px}button,input,textarea,select{font:inherit}button{border:1px solid #d6d0c4;background:#fff;border-radius:9px;padding:9px 16px;cursor:pointer}button.primary{background:#25231f;color:#fff}button:disabled{opacity:.5}textarea,input{display:block;width:100%;border:1px solid #d6d0c4;border-radius:9px;padding:10px;background:#fff}textarea{min-height:125px}label{display:block;margin:12px 0 5px}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.item{padding:14px 0;border-top:1px solid #eee}.item small{display:block;overflow-wrap:anywhere;color:#777}#status{white-space:pre-wrap;overflow-wrap:anywhere}details textarea{min-height:260px}header small{color:#777}#status:empty{display:none}</style>
<main><header><small>设备本地配置 · 数据直接保存到这台设备</small><h1>Valet 随行</h1><p>把你平时聊天的助理，带到身边。</p></header>
<section><h2>已保存的助理</h2><div id="list">正在读取设备…</div></section>
<section><h2>1　让助理做好准备</h2><p>选择你已在使用的助理，把提示发送到你平时的聊天窗口。</p><select id="backend" aria-label="助理类型"><option value="openclaw">OpenClaw</option><option value="hermes">Hermes</option></select><div class="actions"><button id="copy" class="primary">复制配置提示</button></div><details><summary>查看提示全文／手动复制</summary><textarea id="prompt" readonly aria-label="配置提示全文"></textarea></details><p id="copied" role="status"></p></section>
<section><h2>2　粘贴助理的回复</h2><p>粘贴包含 url 和 code 的 JSON 配对信息。配对码只写入设备，保存后不会读回。</p><label for="reply">配对信息</label><textarea id="reply" placeholder='{"url":"wss://…","code":"…"}'></textarea><label for="name">给这个助理起个名字</label><input id="name" maxlength="32" placeholder="例如：家里的助理"><div class="actions"><button id="save" class="primary">保存到设备</button></div></section>
<section><h2>3　查看结果</h2><p id="status" role="status">尚未保存。</p><p>保存后设备会马上去连助理。如果助理那边要求批准，请在十分钟内批准这一台设备，这一页会自己变成「已连接」。之后在设备上关闭配置页。</p></section></main>
<script>
const $=id=>document.getElementById(id);let token=location.hash.slice(1);if(!token)token=window.prompt('输入设备屏幕上的访问码')||'';history.replaceState(null,'',location.pathname);let busy=false;let current=[];
const prefix=`请在运行网关的主机上帮我配置 Valet 随行（Metalio E-Ink4 Plus）。我已安装并通过聊天窗口使用你的助手。先检查现有部署，复用正常配置；缺少组件时请实际检查项目文档。修改前备份，说明会影响当前连接的重启。不要自动升级宿主、购买资源或覆盖其他助手。\n\n设备仓库：https://github.com/vangie/valet-e-ink4-plus\n共享网关固定版本：v0.2.0，提交 d935cf3c90c51fd783d9d327cbfc86457771c83f\n正式包与 SHA256SUMS.txt：https://github.com/vangie/valet-gateway/releases/tag/v0.2.0\n插件包版本仍为 0.8.0，与共享仓库版本分开编号。\n固件使用 Passport v1 签名设备协议，支持提问和实时通话。请使用共享网关项目 https://github.com/vangie/valet-gateway 中的匹配插件，保留原有 Passport 兼容性。首次连接可能需要批准新设备；网页保存配置不等于设备语音测试通过。\n\n`;
function prompt(){const backend=$('backend').value;return prefix+(backend==='openclaw'?`后端是 OpenClaw。参考 https://github.com/vangie/valet-gateway 的 tools/openclaw 文档，确认实际 Release、插件兼容范围及 passport-realtime、/passport/v1 接口。若需安装，按固定版本文档安装并核对发布校验信息，不能只凭插件名猜安装命令。确认插件与公网入口就绪后，再使用该版本支持的 openclaw qr --json --no-ascii --limited --url '<实际已验证的公网 WSS 地址>' 获取 gatewayUrl 与 setupCode。不要输出管理员 token。`:`后端是 Hermes。参考 https://github.com/vangie/valet-gateway 的 tools/hermes 文档，核对活动 home/profile 和实际插件版本。按版本文档启用 ai-passport-hermes 平台。配对使用该插件实际存在的 passport_auth.py 和活动 home；先核对 --help，再执行 pair --url '<实际已验证的公网 WSS 地址>'。不要套用 OpenClaw 的 qr 命令。`)+`\n\n网络：设备会通过 Wi-Fi 或 4G 直连。复用证书有效、持久的公网 wss:// 入口，保留真实端口与 WebSocket 路径。检查 DNS、TLS、WebSocket 升级与鉴权挑战；HTTP 网页可打开不代表语音可用。不得关闭证书校验或允许匿名访问。缺少登录或资源时明确指出我需要做的一步。\n\n能力：分别报告提问、实时语音和工具调用是否就绪，缺少实时语音不影响保存配置。阅读上下文与带书通话由 v0.2.0 能力协商启用，按书与独立会话隔离。问答播报在插件内选择 OpenAI speech，复用已有私有凭据文件或环境变量，不改全局 TTS；不要宣称未经设备验收的能力已实测。正文不默认写长期记忆。\n\n回复：简要报告实际版本、复用或新增项、尚未验证的事项。成功签发后提供一行真实 JSON：{"url":"gatewayUrl 实际值","code":"setupCode 实际值"}，另给助理名称。配对码应包含 url 与 bootstrapToken，可带 oc-pair:// 前缀。不要输出模型 Key、隧道密钥、长期 device token，不使用第三方二维码服务。受阻时只报告阻碍，不编造配对码。`}
function refreshPrompt(){$('prompt').value=prompt()};refreshPrompt();$('backend').onchange=refreshPrompt;
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(prompt());$('copied').textContent='已复制。发给你平时聊天的助理，再把它返回的配对信息粘到下面。'}catch{document.querySelector('details').open=true;$('prompt').focus();$('prompt').select();$('copied').textContent='本地 HTTP 网页需要手动复制：提示全文已选中，请使用系统的复制菜单。'}};
async function request(method='GET',data){const r=await fetch('/api/assistants',{method,headers:{'X-Valet-Setup':token,...(data?{'Content-Type':'application/json'}:{})},...(data?{body:JSON.stringify(data)}:{})});const result=await r.json();if(!r.ok)throw Error(result.error||'设备返回错误');return result}
function message(text){$('status').textContent=text}
function button(text,fn){const b=document.createElement('button');b.textContent=text;b.onclick=fn;return b}
async function load(){const data=await request();current=data.items;busy=data.saving;$('save').disabled=busy;$('list').replaceChildren();for(const a of data.items){const row=document.createElement('div');row.className='item';const title=document.createElement('b');title.textContent=a.name+(a.id===data.active?' · 当前使用':'');const desc=document.createElement('small');desc.textContent=a.backend+' · '+a.url+' · '+(a.paired?'已连接':'还没连上');const actions=document.createElement('div');actions.className='actions';if(a.id!==data.active)actions.append(button('使用',()=>mutate({action:'select',id:a.id})));actions.append(button('移除',()=>{if(confirm('从这台设备移除 '+a.name+'？服务端授权需要在原助理中撤销。'))mutate({action:'remove',id:a.id})}));row.append(title,desc,actions);$('list').append(row)}if(!data.items.length)$('list').textContent='还没有助理，在下面添加。';if(data.note)message(data.note);return data}
async function mutate(data){if(busy)return;busy=true;$('save').disabled=true;try{await request('POST',data);message('正在保存…');let result;for(let i=0;i<20;i++){await new Promise(r=>setTimeout(r,500));result=await load();if(!result.saving)break}if(result?.saving)message('设备仍在保存，请稍候；不要重复提交。');if(data.action==='add'&&!result?.saving&&!result?.note.startsWith('未保存')){$('reply').value='';watch()}}catch(e){message(e.message)}finally{busy=false;$('save').disabled=false}}
let watching=false;async function watch(){if(watching)return;watching=true;try{for(let i=0;i<150;i++){await new Promise(r=>setTimeout(r,2000));if(busy)continue;const d=await load();if(d.paired||!(d.note.startsWith('请在助理')||d.note.startsWith('已保存')||d.note.startsWith('连不上')))break}}catch(e){message(e.message)}finally{watching=false}}
$('save').onclick=()=>{try{const raw=$('reply').value.trim();let reply;try{reply=JSON.parse(raw)}catch{const candidates=raw.match(/\{[^{}]*\}/g)||[];reply=candidates.map(s=>{try{return JSON.parse(s)}catch{return null}}).find(v=>v&&(v.url||v.gatewayUrl)&&(v.code||v.setupCode));if(!reply)throw Error('请粘贴包含 url 和 code 的配对 JSON')}const name=$('name').value.trim();if(!name)throw Error('先给助理起个名字');mutate({action:'add',id:'new',name,backend:$('backend').value,url:reply.url||reply.gatewayUrl||'',code:reply.code||reply.setupCode||''})}catch(e){message(e.message)}};
load().catch(e=>message(e.message));
</script></html>
