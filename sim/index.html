<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Valet 随行 · valet-e-ink4-plus</title>
<link rel="icon" href="assets/valet_icon.png" />
<link rel="stylesheet" href="sim.css?v=20261118-touch2" />
<link rel="stylesheet" href="screen.css" />
<link rel="stylesheet" href="design.css?v=20261125-readhome" />
<link rel="stylesheet" href="setup.css" />
</head>
<body>
<div class="stage">
  <header class="top">
    <div class="brand"><img class="brand-icon" src="assets/valet_icon.png" alt="Valet" /><b>Valet 随行</b><span>Metalio E-Ink4 Plus · 界面模拟</span></div>
    <div class="design-tabs" role="tablist" aria-label="界面设计">
      <button role="tab" data-design="classic">原始设计</button>
      <button role="tab" data-design="v2" class="on">新设计</button>
    </div>
    <button class="reset" data-reset>重置演示</button>
  </header>

  <div class="layout">
    <section class="device" aria-label="设备">
      <div class="shell">
        <div class="plate"></div>
        <div class="panel v2" id="panel"></div>
        <button class="cap menu" data-key="menu" title="菜单（M）"></button>
        <button class="cap prev" data-key="prev" title="返回 / 上一页（←）"></button>
        <button class="cap next" data-key="next" title="前进 / 下一页（→）"></button>
        <button class="key ai" data-key="ai" title="AI 唤醒（A）"></button>
        <button class="key up" data-key="vol-up" title="加音量（W）"></button>
        <button class="key vdown" data-key="vol-down" title="减音量（S）"></button>
        <button class="key power" data-key="power" title="电源（P）"></button>
        <span class="tag t-ai">AI 唤醒 · A</span>
        <span class="tag t-up">加音量 · W</span>
        <span class="tag t-down">减音量 · S</span>
        <span class="tag t-power">电源 · P</span>
      </div>
    </section>

    <aside class="notes">
      <div id="about"></div>
      <p class="fine" id="upstream-status"></p>
      <h3>直接跳到</h3>
      <div class="jump" id="jump"></div>
      <h3>按键</h3>
      <div class="now" id="now"></div>
      <h3>刚才发生了什么</h3>
      <ol class="log" id="log"></ol>
      <p class="fine">都是假数据：不连设备、模型和网关。按键可以点，也可以按住；键盘 M 是菜单，← → 是两颗灰键。</p>
      <p class="fine">触控修订 1118.2</p>
    </aside>
  </div>
</div>
<script src="images.js"></script>
<script src="state.js"></script>
<script src="upstream.js"></script>
<script src="i18n.js"></script>
<script src="screens.js"></script>
<script src="ai.js"></script>
<script src="nav.js"></script>
<script src="live.js"></script>
<script src="keys.js"></script>
<script src="keys2.js"></script>
<script src="local/icons.js"></script>
<script src="design.js?v=20261125-readhome"></script>
<script src="library.js"></script>
<script src="setup.js"></script>
<script src="sim.js?v=20261118-touch2"></script>
<script src="touch.js"></script>
</body>
</html>
